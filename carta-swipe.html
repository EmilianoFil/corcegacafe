<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carta · Modo Swipe (prueba) | Córcega Café</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --dark:   #01323f;
        --coral:  #ed7053;
        --bg:     #0b0b0c;
        --muted:  #cfcfcf;
        --white:  #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
    }
    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--white);
        display: flex;
        flex-direction: column;
    }

    /* ── Header ── */
    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 16px calc(10px + env(safe-area-inset-top, 0px));
        padding-top: calc(14px + env(safe-area-inset-top, 0px));
        z-index: 20;
        position: relative;
    }
    .btn-volver {
        display: flex;
        align-items: center;
        gap: 6px;
        color: rgba(255,255,255,0.8);
        text-decoration: none;
        font-size: 0.78rem;
        font-weight: 600;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        padding: 7px 12px;
        border-radius: 20px;
    }
    .badge-prueba {
        font-family: 'Syncopate', sans-serif;
        font-size: 0.55rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--coral);
        background: rgba(237,112,83,0.12);
        border: 1px solid rgba(237,112,83,0.35);
        padding: 5px 10px;
        border-radius: 20px;
    }
    .progreso {
        font-family: 'Syncopate', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 1px;
        color: rgba(255,255,255,0.55);
    }

    /* ── Stack de cards ── */
    .stack-wrap {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px 16px 10px;
        min-height: 0;
    }

    .card {
        position: absolute;
        width: min(94vw, 420px);
        height: 100%;
        max-height: 100%;
        border-radius: 26px;
        overflow: hidden;
        background: #1a1a1a;
        box-shadow: 0 20px 50px rgba(0,0,0,0.45);
        display: flex;
        flex-direction: column;
        user-select: none;
        -webkit-user-select: none;
        touch-action: pan-y;
        will-change: transform;
    }
    .card.top { z-index: 5; touch-action: none; cursor: grab; }
    .card.top:active { cursor: grabbing; }
    .card.dragging { transition: none !important; }

    .card-foto-zona {
        position: relative;
        flex: 1;
        min-height: 0;
        background: #111;
    }
    .card-foto-zona img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
        -webkit-user-drag: none;
    }
    .card-foto-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        background: linear-gradient(135deg,#25252a,#151518);
    }

    .card-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
        pointer-events: none;
    }

    /* sellos LIKE / NOPE estilo tinder al arrastrar */
    .sello {
        position: absolute;
        top: 34px;
        padding: 8px 14px;
        border: 3px solid;
        border-radius: 10px;
        font-family: 'Syncopate', sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: 0;
        pointer-events: none;
        z-index: 3;
    }
    .sello.anterior { left: 24px; color: #4ade80; border-color: #4ade80; transform: rotate(-18deg); }
    .sello.siguiente { right: 24px; color: var(--coral); border-color: var(--coral); transform: rotate(18deg); }

    .card-info {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        padding: 18px 20px 20px;
        z-index: 2;
    }

    .card-seccion {
        font-family: 'Syncopate', sans-serif;
        font-size: 0.6rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--coral);
        margin-bottom: 6px;
    }

    .card-nombre {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-size: 1.5rem;
        line-height: 1.2;
        margin-bottom: 8px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }

    .card-desc {
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 12px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
    }

    .card-precio {
        font-family: 'Syncopate', sans-serif;
        font-weight: 700;
        font-size: 1.15rem;
        color: var(--white);
    }

    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
        font-size: 0.62rem;
        padding: 3px 9px;
        border-radius: 20px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        font-weight: 600;
        backdrop-filter: blur(4px);
    }

    /* ── Controles inferiores ── */
    .controles {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 6px 16px calc(18px + env(safe-area-inset-bottom, 0px));
        z-index: 20;
    }
    .btn-control {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: none;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        color: white;
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform .15s, background .15s;
    }
    .btn-control:active { transform: scale(0.9); background: rgba(255,255,255,0.18); }
    .btn-control.grande { width: 64px; height: 64px; font-size: 1.6rem; background: var(--coral); border-color: var(--coral); }
    .btn-control.grande:active { background: #d85a3f; }

    .hint-swipe {
        position: absolute;
        bottom: 50%;
        left: 50%;
        transform: translate(-50%, 50%);
        text-align: center;
        font-family: 'Syncopate', sans-serif;
        font-size: 0.62rem;
        letter-spacing: 1.5px;
        color: rgba(255,255,255,0.35);
        text-transform: uppercase;
        pointer-events: none;
        z-index: 6;
        animation: fadeOutHint 3.5s forwards;
    }
    @keyframes fadeOutHint { 0%,60% { opacity:1 } 100% { opacity:0 } }

    #loader, .empty-state {
        margin: auto;
        text-align: center;
        color: rgba(255,255,255,0.5);
        font-family: 'Syncopate', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }
</style>
</head>
<body>

<header>
    <a class="btn-volver" href="carta.html">‹ Carta</a>
    <span class="badge-prueba">Prueba · Modo Swipe</span>
    <span class="progreso" id="progreso">— / —</span>
</header>

<div class="stack-wrap" id="stack-wrap">
    <div id="loader">Cargando carta...</div>
</div>

<div class="controles" id="controles" style="display:none;">
    <button class="btn-control" id="btn-prev" title="Anterior">‹</button>
    <button class="btn-control grande" id="btn-abrir" title="Ver foto en grande">🔍</button>
    <button class="btn-control" id="btn-next" title="Siguiente">›</button>
</div>

<script type="module">
    import { db } from './js/firebase-config.js';
    import {
        collection, getDocs, query, orderBy
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const fotoMedium = f => typeof f === 'string' ? f : (f?.medium ?? f?.thumb ?? '');
    const fotoFull   = f => typeof f === 'string' ? f : (f?.full ?? f?.medium ?? f?.thumb ?? '');

    function tagLabel(t) {
        const map = {
            vegetariano: '🌱 Vegetariano', vegano: '🌿 Vegano',
            'sin-tacc': 'Sin T.A.C.C.', destacado: '⭐ Destacado', nuevo: '✨ Nuevo',
        };
        return map[t] ?? t;
    }

    let platos = [];
    let secciones = {};
    let idx = 0;

    const stackWrap  = document.getElementById('stack-wrap');
    const controles   = document.getElementById('controles');
    const progresoEl  = document.getElementById('progreso');

    async function init() {
        try {
            const [snapSec, snapPlatos] = await Promise.all([
                getDocs(query(collection(db, 'carta_secciones'), orderBy('orden'))),
                getDocs(query(collection(db, 'carta_platos'), orderBy('orden')))
            ]);
            snapSec.docs.forEach(d => { secciones[d.id] = d.data(); });
            platos = snapPlatos.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(p => p.activo !== false && (p.fotos?.length));

            if (!platos.length) {
                stackWrap.innerHTML = `<div class="empty-state">No hay platos con foto todavía</div>`;
                return;
            }

            controles.style.display = 'flex';
            render();
        } catch (err) {
            console.error(err);
            stackWrap.innerHTML = `<div class="empty-state">Error cargando la carta</div>`;
        }
    }

    function render() {
        stackWrap.innerHTML = '';
        progresoEl.textContent = `${idx + 1} / ${platos.length}`;

        // Muestra hasta 3 cards apiladas: la de arriba (actual) + 2 de fondo (siguientes)
        const visibles = [2, 1, 0].map(off => platos[(idx + off) % platos.length]);
        const seen = new Set();
        visibles.forEach((p, posDesdeAtras) => {
            if (seen.has(p.id) && platos.length > 1) return; // evita duplicar si hay pocos platos
            seen.add(p.id);
            const esTop = posDesdeAtras === visibles.length - 1;
            const card = crearCard(p, esTop);
            const profundidad = visibles.length - 1 - posDesdeAtras;
            if (!esTop) {
                card.style.transform = `translateY(${profundidad * 10}px) scale(${1 - profundidad * 0.04})`;
                card.style.opacity = profundidad === 1 ? '0.85' : '0.6';
            }
            stackWrap.appendChild(card);
        });

        if (idx === 0) {
            const hint = document.createElement('div');
            hint.className = 'hint-swipe';
            hint.innerHTML = '← deslizá para ver más →';
            stackWrap.appendChild(hint);
        }
    }

    function crearCard(p, esTop) {
        const card = document.createElement('div');
        card.className = 'card' + (esTop ? ' top' : '');

        const foto = p.fotos?.[0];
        const fotoZona = document.createElement('div');
        fotoZona.className = 'card-foto-zona';
        fotoZona.innerHTML = foto
            ? `<img src="${fotoMedium(foto)}" alt="${p.nombre ?? ''}" draggable="false">`
            : `<div class="card-foto-placeholder">🍽️</div>`;
        fotoZona.innerHTML += `<div class="card-gradient"></div>`;
        fotoZona.innerHTML += `<div class="sello anterior">Anterior</div><div class="sello siguiente">Siguiente</div>`;
        card.appendChild(fotoZona);

        const precio = p.precio != null ? `$${Number(p.precio).toLocaleString('es-AR')}` : '';
        const tags = (p.tags ?? []).map(t => `<span class="tag">${tagLabel(t)}</span>`).join('');
        const seccionNombre = secciones[p.seccionId]?.nombre ?? '';

        const info = document.createElement('div');
        info.className = 'card-info';
        info.innerHTML = `
            ${seccionNombre ? `<p class="card-seccion">${seccionNombre}</p>` : ''}
            <p class="card-nombre">${p.nombre ?? ''}</p>
            ${p.descripcion ? `<p class="card-desc">${p.descripcion}</p>` : ''}
            <div class="card-footer">
                ${precio ? `<span class="card-precio">${precio}</span>` : '<span></span>'}
                <div class="card-tags">${tags}</div>
            </div>`;
        card.appendChild(info);

        if (esTop) habilitarSwipe(card, p);
        return card;
    }

    // ── Swipe (pointer events: funciona con mouse y touch) ────────────────────
    function habilitarSwipe(card, plato) {
        let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, pointerId = null;
        const UMBRAL = 90;

        card.addEventListener('pointerdown', e => {
            if (e.button !== undefined && e.button !== 0) return;
            dragging = true;
            pointerId = e.pointerId;
            card.setPointerCapture(pointerId);
            card.classList.add('dragging');
            startX = e.clientX;
            startY = e.clientY;
        });

        card.addEventListener('pointermove', e => {
            if (!dragging) return;
            dx = e.clientX - startX;
            dy = e.clientY - startY;
            const rot = dx / 18;
            card.style.transform = `translate(${dx}px, ${dy * 0.15}px) rotate(${rot}deg)`;

            const selloSig = card.querySelector('.sello.siguiente');
            const selloAnt = card.querySelector('.sello.anterior');
            const fuerza = Math.min(Math.abs(dx) / UMBRAL, 1);
            if (dx < 0) { selloSig.style.opacity = fuerza; selloAnt.style.opacity = 0; }
            else if (dx > 0) { selloAnt.style.opacity = fuerza; selloSig.style.opacity = 0; }
            else { selloSig.style.opacity = 0; selloAnt.style.opacity = 0; }
        });

        function soltar(e) {
            if (!dragging) return;
            dragging = false;
            card.classList.remove('dragging');
            try { card.releasePointerCapture(pointerId); } catch (_) {}

            if (Math.abs(dx) > UMBRAL) {
                dispararSwipe(card, dx > 0 ? 1 : -1);
            } else {
                card.style.transition = 'transform 0.3s cubic-bezier(0.32,0.72,0,1)';
                card.style.transform = '';
                card.querySelectorAll('.sello').forEach(s => s.style.opacity = 0);
            }
            dx = 0; dy = 0;
        }

        card.addEventListener('pointerup', soltar);
        card.addEventListener('pointercancel', soltar);

        // click en la card (sin haber arrastrado) abre foto full HD
        card.addEventListener('click', e => {
            if (Math.abs(dx) > 5) return;
            abrirFotoCompleta(plato);
        });
    }

    // dir 1 = derecha (anterior), dir -1 = izquierda (siguiente)
    function dispararSwipe(card, dir) {
        const salida = dir > 0 ? window.innerWidth + 200 : -window.innerWidth - 200;
        card.style.transition = 'transform 0.35s ease-out';
        card.style.transform = `translate(${salida}px, ${(Math.random() - 0.5) * 80}px) rotate(${dir * -25}deg)`;
        setTimeout(() => {
            idx = dir > 0
                ? (idx - 1 + platos.length) % platos.length
                : (idx + 1) % platos.length;
            render();
        }, 220);
    }

    function abrirFotoCompleta(p) {
        const foto = p.fotos?.[0];
        if (!foto) return;
        window.open(fotoFull(foto), '_blank');
    }

    document.getElementById('btn-prev').addEventListener('click', () => {
        const top = document.querySelector('.card.top');
        if (top) dispararSwipe(top, 1);
    });
    document.getElementById('btn-next').addEventListener('click', () => {
        const top = document.querySelector('.card.top');
        if (top) dispararSwipe(top, -1);
    });
    document.getElementById('btn-abrir').addEventListener('click', () => {
        abrirFotoCompleta(platos[idx]);
    });

    document.addEventListener('keydown', e => {
        const top = document.querySelector('.card.top');
        if (!top) return;
        if (e.key === 'ArrowLeft')  dispararSwipe(top, 1);
        if (e.key === 'ArrowRight') dispararSwipe(top, -1);
    });

    init();
</script>

</body>
</html>
