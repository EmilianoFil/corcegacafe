<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <title>Abriéndo sitio...</title>
  <style>
    body {
      background-color: #d86634;
      color: white;
      font-family: 'Syncopate', serif;
      text-align: center;
      margin-top: 20vh;
    }
    .logo {
      width: 100px;
      margin-bottom: 30px;
    }
    .galope {
      animation: galopar 1s infinite ease-in-out alternate;
    }

    @keyframes galopar {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }
    @media (max-width: 480px) {
      h1 {
        font-size: 18px;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>
  <img src="css/img/Corcega_Logo_Original.png" class="logo galope" alt="Córcega Logo" />
  <h1>Galopando hasta el sitio de Córcega 🐎</h1>
  <script type="module">
    import { redirigirQr } from './js/qr-redirect.js';
    const slug = new URLSearchParams(window.location.search).get('id');
    redirigirQr(slug || 'QR1', 'https://corcegacafe.com.ar/');
  </script>
</body>
</html>
