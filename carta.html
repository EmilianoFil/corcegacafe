<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta y Menú | Córcega Café — Caballito, Buenos Aires</title>
    <meta name="description" content="Descubrí la carta de Córcega Café: cafés de especialidad, pastelería artesanal, brunch y más. En Caballito, Buenos Aires. Martes a domingo de 8 a 20hs." />
    <link rel="canonical" href="https://corcegacafe.com.ar/carta.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Carta y Menú | Córcega Café" />
    <meta property="og:description" content="Cafés de especialidad, pastelería artesanal y brunch en Caballito, Buenos Aires. Martes a domingo de 8 a 20hs." />
    <meta property="og:url" content="https://corcegacafe.com.ar/carta.html" />
    <meta property="og:image" content="https://corcegacafe.com.ar/css/img/og-imagen.jpg" />
    <meta property="og:site_name" content="Córcega Café" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Carta y Menú | Córcega Café" />
    <meta name="twitter:image" content="https://corcegacafe.com.ar/css/img/og-imagen.jpg" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;500;600&family=Orbitron&display=swap" rel="stylesheet">
    <style>
      #footer-copyright {
        width: 100%;
        padding: 9px 0;
        text-align: center;
        font-size: 10px;
        font-family: "Orbitron", sans-serif;
        color: #333;
        background-color: #e8d8cc;
        margin-top: auto;
      }
      #footer-copyright p { margin: 0; }
    </style>
    <style>
        :root {
            --dark:   #01323f;
            --coral:  #ed7053;
            --bg:     #fdfcf7;
            --border: #e0dbd2;
            --muted:  #7a7a7a;
            --white:  #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: #1d1d1d;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('css/img/wallpaper.png');
            background-repeat: repeat;
            background-size: 600px;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        /* ── Header ── */
        header {
            background: var(--dark);
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            grid-template-rows: 80px auto;
            align-items: center;
            padding: 0 20px;
            /* fuerza compositing layer en iOS Safari — arregla taps en sticky */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            grid-column: 2;
        }

        .header-actions {
            grid-column: 3;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            justify-self: end;
        }

        .header-link-tienda {
            color: rgba(255,255,255,0.6);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
            transition: color .2s;
        }
        .header-link-tienda:hover { color: white; }

        #lang-switcher {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 5px 8px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        #lang-switcher option { color: #1d1d1d; }

        #carta-user-btn {
            display: none;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background .2s;
            white-space: nowrap;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #carta-user-btn:hover { background: rgba(255,255,255,0.18); }
        body.social-activo #carta-user-btn { display: flex; }

        /* ── Botón ❤️ en cards ── */
        .plato-info { position: relative; }

        .plato-card .btn-fav-carta {
            display: none;
            position: absolute;
            top: 8px;
            right: 8px;
            background: url('css/img/heart-outline.svg') center/contain no-repeat;
            border: none;
            padding: 0;
            width: 20px;
            height: 20px;
            cursor: pointer;
            opacity: 0.45;
            transition: opacity .2s;
            z-index: 2;
            font-size: 0;
        }
        body.social-activo .plato-card .btn-fav-carta { display: block; }
        .plato-card .btn-fav-carta.fav-activo {
            background-image: url('css/img/heart-filled.svg');
            opacity: 1;
        }
        .plato-card .btn-fav-carta:not(.fav-activo):hover { opacity: 0.8; }

        /* ── Badge "los más amados" ── */
        .badge-amado {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(237,112,83,0.92);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 20px;
            z-index: 2;
        }

        /* ── Botones probado/fav activos en modal ── */
        .btn-probado-carta.probado-activo {
            background: #01323f !important;
            color: white !important;
        }

        .header-left {
            grid-column: 1;
            display: flex;
            justify-content: flex-start;
        }

        .header-left img {
            width: 45px;
            height: auto;
            filter: brightness(0) invert(1);
        }

        .header-top {
            text-align: center;
        }

        .header-top h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 4px;
            text-transform: uppercase;
            display: block;
        }

        .header-subtitle {
            font-family: 'Syncopate', sans-serif;
            font-size: 11px;
            font-weight: 800;
            color: var(--white);
            letter-spacing: 5px;
            text-transform: uppercase;
            display: block;
            margin-top: 2px;
        }

        /* ── Tabs ── */
        .tabs-scroll {
            grid-column: 1 / -1;
            display: flex;
            overflow-x: auto;
            scrollbar-width: none;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .tabs-scroll::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex-shrink: 0;
            padding: 13px 22px;
            border: none;
            background: transparent;
            font-family: 'Syncopate', serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: color 0.2s, border-color 0.2s;
            white-space: nowrap;
            /* elimina delay de 300ms en iOS */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-btn.active {
            color: var(--coral);
            border-bottom-color: var(--coral);
        }

        /* ── Contenido ── */
        main {
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 28px 16px 80px;
            flex: 1;
        }

        /* ── Sección ── */
        .carta-seccion {
            margin-bottom: 40px;
            /* espacio para que el sticky header no tape el título al scrollear */
            scroll-margin-top: calc(var(--header-h, 120px) + 12px);
        }

        .seccion-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-style: italic;
            color: var(--dark);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        /* ── Cards ── */
        .platos-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .plato-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.15s;
            box-shadow: 0 2px 8px rgba(1,50,63,0.05);
            position: relative;
        }
        .plato-card:active { transform: scale(0.985); }
        .plato-card:hover  { box-shadow: 0 6px 20px rgba(1,50,63,0.1); }

        .plato-info {
            flex: 1;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            min-width: 0;
        }

        .plato-nombre {
            font-family: 'Syncopate', serif;
            font-weight: 700;
            font-size: 0.68rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--dark);
            line-height: 1.45;
        }

        .plato-desc {
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .plato-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .plato-precio {
            font-family: 'Syncopate', serif;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--coral);
        }

        .tag {
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 20px;
            background: #f0f0f0;
            color: #666;
            font-weight: 600;
        }
        .tag.vegetariano { background: #e8f5e9; color: #2d6a4f; }
        .tag.vegano       { background: #e8f5e9; color: #1b5e20; }
        .tag.sin-tacc     { background: white; color: #c0392b; border: 1px solid #eee; padding: 2px 6px 2px 2px; }
        .tag.sin-tacc img { height: 16px; width: auto; vertical-align: middle; margin-right: 3px; display: inline-block; }
        .tag.destacado    { background: #fff8e1; color: #c17900; }
        .tag.nuevo        { background: #eaf4f7; color: #01546a; }

        /* ── Barra de filtros por tag ── */
        .filtros-bar {
            display: none;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 16px 16px 0;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filtros-bar::-webkit-scrollbar { display: none; }

        .filtro-chip {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            background: var(--white);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            white-space: nowrap;
            transition: background .2s, color .2s, border-color .2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .filtro-chip img { height: 16px; width: auto; }
        .filtro-chip.activo {
            background: var(--dark);
            border-color: var(--dark);
            color: white;
        }
        .filtro-chip.activo img { filter: brightness(0) invert(1); }

        /* ── Sección "Los que querías probar" ── */
        .carta-seccion.qp .seccion-titulo {
            color: var(--coral);
            border-bottom-color: rgba(237,112,83,0.35);
        }

        /* ── Botón compartir en modal ── */
        .btn-compartir {
            border: 1.5px solid var(--border);
            background: var(--white);
            border-radius: 10px;
            padding: 8px 14px;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--dark);
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
        }
        .btn-compartir:active { background: #f5f2ec; }

        .plato-foto {
            width: 110px;
            min-height: 110px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .plato-foto-placeholder {
            width: 110px;
            background: #f0ece4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(1,50,63,0.65);
            z-index: 999;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal-sheet {
            background: var(--white);
            border-radius: 22px 22px 0 0;
            width: 100%;
            max-width: 640px;
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 10;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            border: none;
            color: white;
            font-size: 1.05rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .modal-close:active { background: rgba(0,0,0,0.7); }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin: 12px auto 0;
        }

        .modal-fotos {
            position: relative;
            background: #111;
            aspect-ratio: 4/3;
            overflow: hidden;
        }

        .modal-fotos img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .modal-fotos img.visible { display: block; }

        .foto-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }
        .foto-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.45);
            cursor: pointer;
            transition: background 0.2s;
        }
        .foto-dot.active { background: white; }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.3);
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-nav.prev { left: 10px; }
        .modal-nav.next { right: 10px; }

        .modal-body { padding: 22px 20px 40px; }

        .modal-nombre {
            font-family: 'Syncopate', serif;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--dark);
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .modal-desc {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .modal-precio {
            font-family: 'Syncopate', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--coral);
        }

        .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }

        /* ── Botón HD ── */
        .btn-hd {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            font-family: 'Syncopate', serif;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.2s;
        }
        .btn-hd:active { background: rgba(0,0,0,0.7); }
        .btn-hd.loaded { border-color: var(--coral); color: var(--coral); }

        /* ── Estados ── */
        #loader, .empty-state {
            text-align: center;
            padding: 70px 20px;
            color: var(--muted);
            font-family: 'Syncopate', serif;
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
    </style>

</head>
<body>

<header id="main-header">
    <div class="header-left">
        <img src="css/img/Corcega_Logo_Original.png" alt="Córcega">
    </div>
    <div class="header-top">
        <h1>Carta</h1>
        <span class="header-subtitle">Córcega</span>
    </div>
    <div class="header-actions">
        <select id="lang-switcher" title="Idioma / Language / Idioma / 언어">
            <option value="es">🇦🇷 ES</option>
            <option value="en">🇬🇧 EN</option>
            <option value="pt">🇧🇷 PT</option>
            <option value="ko">🇰🇷 KO</option>
        </select>
        <button id="carta-user-btn" onclick="window.cartaSocial?.accionBotonUsuario()">
            <span>👤</span><span id="txt-entrar">Entrar</span>
        </button>
    </div>
    <div class="tabs-scroll" id="tabs-secciones"></div>
</header>

<!-- Filtros por tag -->
<div class="filtros-bar" id="filtros-bar">
    <button class="filtro-chip" data-tag="vegetariano" onclick="toggleFiltro('vegetariano')"><span data-i18n="tagVegetariano">🌱 Vegetariano</span></button>
    <button class="filtro-chip" data-tag="vegano" onclick="toggleFiltro('vegano')"><span data-i18n="tagVegano">🌿 Vegano</span></button>
    <button class="filtro-chip" data-tag="sin-tacc" onclick="toggleFiltro('sin-tacc')"><img src="css/img/sin-tacc.svg" alt=""> <span data-i18n="tagSinTacc">Sin T.A.C.C.</span></button>
    <button class="filtro-chip" data-tag="nuevo" onclick="toggleFiltro('nuevo')"><span data-i18n="tagNuevo">✨ Nuevo</span></button>
</div>

<main id="main-content">
    <div id="loader">Cargando carta...</div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="cerrarModal(event)">
    <div class="modal-sheet">
        <button class="modal-close" onclick="cerrarModalX()" title="Cerrar">✕</button>
        <div class="modal-handle"></div>
        <div class="modal-fotos" id="modal-fotos"></div>
        <div class="modal-body">
            <p class="modal-nombre" id="modal-nombre"></p>
            <p class="modal-desc"   id="modal-desc"></p>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                <p class="modal-precio" id="modal-precio"></p>
                <button class="btn-compartir" id="btn-compartir" onclick="compartirPlato()" title="Compartir este plato">📤 Compartir</button>
            </div>
            <div class="modal-tags" id="modal-tags"></div>
            <div id="modal-social"></div>
        </div>
    </div>
</div>

<script type="module">
    import { db } from './js/firebase-config.js';
    import {
        collection, getDocs, query, orderBy
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // Compatibilidad: foto puede ser string (viejo) o {thumb,medium,full} (nuevo)
    const fotoThumb  = f => typeof f === 'string' ? f : (f?.thumb  ?? '');
    const fotoMedium = f => typeof f === 'string' ? f : (f?.medium ?? f?.thumb ?? '');
    const fotoFull   = f => typeof f === 'string' ? f : (f?.full   ?? f?.medium ?? f?.thumb ?? '');

    // ── i18n ─────────────────────────────────────────────────────────────────
    // Strings de UI traducidos a mano. Nombre/descripción de cada plato o
    // sección se toman de nombre_<lang>/descripcion_<lang> si existen en el
    // doc de Firestore, y si no, caen a español (nombre/descripcion).
    const I18N = {
        es: {
            entrar: 'Entrar', compartir: '📤 Compartir', quieroProbar: 'Quiero probarlo',
            cargando: 'Cargando carta...', prepPronto: 'Carta en preparación — volvé pronto',
            seccionPrep: 'Sección en preparación.', sinResultados: 'No hay platos con esos filtros',
            tardando: 'La carta está tardando más de lo normal.<br>', reintentar: 'Reintentar',
            qpTitulo: '🔖 Los que querías probar',
            tagVegetariano: '🌱 Vegetariano', tagVegano: '🌿 Vegano', tagSinTacc: 'Sin T.A.C.C.',
            tagDestacado: '⭐ Destacado', tagNuevo: '✨ Nuevo',
        },
        en: {
            entrar: 'Sign in', compartir: '📤 Share', quieroProbar: 'Want to try it',
            cargando: 'Loading menu...', prepPronto: 'Menu coming soon — check back later',
            seccionPrep: 'Section coming soon.', sinResultados: 'No dishes match these filters',
            tardando: 'This is taking longer than usual.<br>', reintentar: 'Retry',
            qpTitulo: '🔖 Saved to try',
            tagVegetariano: '🌱 Vegetarian', tagVegano: '🌿 Vegan', tagSinTacc: 'Gluten-free',
            tagDestacado: '⭐ Featured', tagNuevo: '✨ New',
        },
        pt: {
            entrar: 'Entrar', compartir: '📤 Compartilhar', quieroProbar: 'Quero provar',
            cargando: 'Carregando cardápio...', prepPronto: 'Cardápio em preparação — volte em breve',
            seccionPrep: 'Seção em preparação.', sinResultados: 'Nenhum prato com esses filtros',
            tardando: 'Isso está demorando mais do que o normal.<br>', reintentar: 'Tentar novamente',
            qpTitulo: '🔖 Salvos para provar',
            tagVegetariano: '🌱 Vegetariano', tagVegano: '🌿 Vegano', tagSinTacc: 'Sem glúten',
            tagDestacado: '⭐ Destaque', tagNuevo: '✨ Novo',
        },
        ko: {
            entrar: '로그인', compartir: '📤 공유', quieroProbar: '먹어보고 싶어요',
            cargando: '메뉴 불러오는 중...', prepPronto: '메뉴 준비 중입니다 — 곧 다시 확인해주세요',
            seccionPrep: '섹션 준비 중입니다.', sinResultados: '해당 필터에 맞는 메뉴가 없습니다',
            tardando: '평소보다 시간이 걸리고 있습니다.<br>', reintentar: '다시 시도',
            qpTitulo: '🔖 담아둔 메뉴',
            tagVegetariano: '🌱 채식', tagVegano: '🌿 비건', tagSinTacc: '글루텐 프리',
            tagDestacado: '⭐ 추천', tagNuevo: '✨ 신메뉴',
        },
    };

    let lang = localStorage.getItem('cartaLang') || 'es';
    if (!I18N[lang]) lang = 'es';

    function tr(key) { return I18N[lang][key] ?? I18N.es[key] ?? key; }

    // Devuelve el campo localizado de un doc (plato o sección), con fallback a español
    function loc(obj, campo) {
        return obj[`${campo}_${lang}`] || obj[campo] || '';
    }

    function aplicarI18nEstatico() {
        // Optional chaining: "Entrar" puede haber sido reemplazado por el nombre
        // del usuario logueado (carta-social.js reescribe #carta-user-btn), y
        // si esa línea explota corta el resto de la función — incluido el
        // re-render de los platos que dispara el listener del switch de idioma.
        const txtEntrar = document.getElementById('txt-entrar');
        if (txtEntrar) txtEntrar.textContent = tr('entrar');
        const btnCompartir = document.getElementById('btn-compartir');
        if (btnCompartir) btnCompartir.innerHTML = tr('compartir');
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = tr(el.dataset.i18n);
        });
        document.querySelector('.btn-fav-carta')?.setAttribute('title', tr('quieroProbar'));
        document.documentElement.lang = lang;
        document.getElementById('lang-switcher').value = lang;
    }

    document.getElementById('lang-switcher').addEventListener('change', e => {
        lang = e.target.value;
        localStorage.setItem('cartaLang', lang);
        aplicarI18nEstatico();
        if (_cartaLista) aplicarVista();
        if (_platoAbiertoId) window.abrirModal(_platoAbiertoId);
    });

    aplicarI18nEstatico();

    function tagLabel(t) {
        if (t === 'vegetariano') return tr('tagVegetariano');
        if (t === 'vegano')      return tr('tagVegano');
        if (t === 'sin-tacc')    return `<img src="css/img/sin-tacc.svg" alt="Sin TACC"> ${tr('tagSinTacc')}`;
        if (t === 'destacado')   return tr('tagDestacado');
        if (t === 'nuevo')       return tr('tagNuevo');
        return t;
    }

    let platos = [];
    let seccionesGlobal = [];
    let filtrosActivos  = new Set();
    let _platoAbiertoId = null;
    const FILTRO_TAGS = ['vegetariano', 'vegano', 'sin-tacc', 'nuevo'];
    let fotoIdx = 0;
    let pausaObserver = false;  // evita que el observer pise el tab activo durante scroll programático
    let pausaTimer    = null;

    // ── Evita scroll restoration del browser que tapa el header ──────────────
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

    // ── Carga ────────────────────────────────────────────────────────────────
    // Los navegadores in-app (Instagram, TikTok) a veces tardan en abrir la
    // conexión con Firestore la primera vez y se quedan colgados sin arrojar
    // error. Le ponemos un timeout y reintentamos solos un par de veces antes
    // de pedirle al usuario que actúe.
    let _cartaLista = false;
    let _cargando   = false;

    function _conTimeout(promise, ms) {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
        ]);
    }

    async function init(intento = 1) {
        if (_cargando) return;
        _cargando = true;
        document.getElementById('loader').textContent = tr('cargando');
        try {
            const [snapSec, snapPlatos] = await _conTimeout(Promise.all([
                getDocs(query(collection(db, 'carta_secciones'), orderBy('orden'))),
                getDocs(query(collection(db, 'carta_platos'),    orderBy('orden')))
            ]), 8000);
            _cargando   = false;
            _cartaLista = true;

            const secciones = snapSec.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(s => s.activa !== false);

            platos = snapPlatos.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(p => p.activo !== false);

            if (!secciones.length) {
                document.getElementById('loader').textContent = tr('prepPronto');
                return;
            }

            seccionesGlobal = secciones;
            window.cartaSocial?.setPlatos(Object.fromEntries(platos.map(p => [p.id, p])));
            aplicarVista();

            // Mostrar solo los chips de tags que algún plato tenga
            const tagsPresentes = new Set(platos.flatMap(p => p.tags ?? []));
            document.querySelectorAll('#filtros-bar .filtro-chip').forEach(chip => {
                chip.style.display = tagsPresentes.has(chip.dataset.tag) ? '' : 'none';
            });
            if (FILTRO_TAGS.some(t => tagsPresentes.has(t))) {
                document.getElementById('filtros-bar').style.display = 'flex';
            }

            // Deep link: carta.html?plato=ID abre el modal de ese plato
            const platoParam = new URLSearchParams(location.search).get('plato');
            if (platoParam && platos.some(p => p.id === platoParam)) {
                setTimeout(() => abrirModal(platoParam), 400);
            }

        } catch (err) {
            _cargando = false;
            if (err?.message === 'timeout' && intento < 3) {
                setTimeout(() => init(intento + 1), 500 * intento);
                return;
            }
            console.error(err);
            document.getElementById('loader').innerHTML =
                tr('tardando') +
                `<button onclick="location.reload()" style="margin-top:14px;padding:10px 22px;border:none;border-radius:10px;background:var(--coral);color:white;font-family:inherit;font-weight:700;font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;">${tr('reintentar')}</button>`;
        }
    }

    // Los navegadores in-app suelen "congelar" la pestaña mientras está en
    // segundo plano (precarga antes de que el usuario la abra); al volver a
    // primer plano reintentamos si todavía no cargó nada.
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !_cartaLista && !_cargando) init();
    });

    // ── Tabs ─────────────────────────────────────────────────────────────────
    function renderTabs(secciones) {
        document.getElementById('tabs-secciones').innerHTML = secciones.map(s =>
            `<button class="tab-btn" data-id="${s.id}" onclick="scrollASeccion('${s.id}')">${loc(s, 'nombre')}</button>`
        ).join('');
        // activar el primero
        document.querySelector('.tab-btn')?.classList.add('active');
    }

    function activarTab(id) {
        document.querySelectorAll('.tab-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.id === id)
        );
        // Scroll horizontal del contenedor de tabs para centrar el activo
        // — sin scrollIntoView que arrastra la página verticalmente
        const tabsEl = document.getElementById('tabs-secciones');
        const btn    = tabsEl.querySelector(`.tab-btn[data-id="${id}"]`);
        if (btn) {
            const offset = btn.offsetLeft - tabsEl.clientWidth / 2 + btn.offsetWidth / 2;
            tabsEl.scrollTo({ left: offset, behavior: 'smooth' });
        }
    }

    window.scrollASeccion = function(id) {
        const el      = document.getElementById('sec-' + id);
        const headerH = document.getElementById('main-header').offsetHeight;
        if (!el) return;

        activarTab(id);

        // Pausar el observer durante el scroll animado para que no lo pise
        pausaObserver = true;
        clearTimeout(pausaTimer);
        pausaTimer = setTimeout(() => { pausaObserver = false; }, 900);

        const top = el.getBoundingClientRect().top + window.scrollY - headerH - 8;
        window.scrollTo({ top, behavior: 'smooth' });
    };

    // ── Contenido único (scroll largo) ───────────────────────────────────────
    function renderContenido(secciones, lista = platos) {
        const main = document.getElementById('main-content');
        if (filtrosActivos.size && !lista.length) {
            main.innerHTML = `<div class="empty-state">${tr('sinResultados')}</div>`;
            return;
        }
        main.innerHTML = secciones.map(s => {
            const enSec = lista.filter(p => p.seccionId === s.id);
            const items = enSec.length
                ? enSec.map(p => cardPlato(p)).join('')
                : `<p style="color:var(--muted);font-size:0.8rem;padding:10px 0;">${tr('seccionPrep')}</p>`;
            return `
                <section class="carta-seccion" id="sec-${s.id}" data-seccion-id="${s.id}">
                    <h2 class="seccion-titulo">${loc(s, 'nombre')}</h2>
                    <div class="platos-grid">${items}</div>
                </section>`;
        }).join('');
    }

    // ── Filtros por tag ──────────────────────────────────────────────────────
    function platosFiltrados() {
        if (!filtrosActivos.size) return platos;
        return platos.filter(p => [...filtrosActivos].every(t => (p.tags ?? []).includes(t)));
    }

    function aplicarVista() {
        const visibles = platosFiltrados();
        const secs = filtrosActivos.size
            ? seccionesGlobal.filter(s => visibles.some(p => p.seccionId === s.id))
            : seccionesGlobal;

        renderTabs(secs);
        renderContenido(secs, visibles);
        renderSeccionQP(visibles);
        initScrollSpy(secs);
        window.cartaSocial?.onCartaRendered();
        _ajustarScrollMargin();
    }

    function _ajustarScrollMargin() {
        const headerH = document.getElementById('main-header').offsetHeight;
        document.querySelectorAll('.carta-seccion').forEach(el => {
            el.style.scrollMarginTop = (headerH + 12) + 'px';
        });
    }

    window.toggleFiltro = function(tag) {
        // Selección única: tocar otro filtro reemplaza al activo; tocar el activo lo apaga
        const yaActivo = filtrosActivos.has(tag);
        filtrosActivos.clear();
        if (!yaActivo) filtrosActivos.add(tag);
        document.querySelectorAll('#filtros-bar .filtro-chip').forEach(chip => {
            chip.classList.toggle('activo', filtrosActivos.has(chip.dataset.tag));
        });
        aplicarVista();
    };

    // ── Sección personalizada "Los que querías probar" ───────────────────────
    function renderSeccionQP(visibles = platosFiltrados()) {
        document.getElementById('sec-_qp')?.remove();
        const ids = new Set(window.cartaSocial?.getQuieroProbar?.() ?? []);
        if (!ids.size) return;
        const mios = visibles.filter(p => ids.has(p.id));
        if (!mios.length) return;
        const sec = document.createElement('section');
        sec.className = 'carta-seccion qp';
        sec.id = 'sec-_qp';
        sec.innerHTML = `
            <h2 class="seccion-titulo">${tr('qpTitulo')}</h2>
            <div class="platos-grid">${mios.map(p => cardPlato(p)).join('')}</div>`;
        document.getElementById('main-content').prepend(sec);
        _ajustarScrollMargin();
    }

    document.addEventListener('carta-qp-changed', () => {
        renderSeccionQP();
        window.cartaSocial?.onCartaRendered();
    });

    // ── Compartir plato ──────────────────────────────────────────────────────
    window.compartirPlato = async function() {
        const p = platos.find(pl => pl.id === _platoAbiertoId);
        if (!p) return;
        // Hosting de Firebase reescribe /p/<id> a la función sharePlato, que sirve
        // la preview con la foto del plato (WhatsApp no ejecuta JS) y redirige a la carta
        const url    = `https://corcega-loyalty-club.web.app/p/${p.id}`;
        const precio = p.precio != null ? ` — $${Number(p.precio).toLocaleString('es-AR')}` : '';
        const texto  = `${loc(p, 'nombre')}${precio} · Córcega Café`;
        // El contador se incrementa server-side: las reglas de Firestore no permiten
        // writes anónimos en carta_plato_stats
        const contarShare = () => fetch(
            `https://us-central1-corcega-loyalty-club.cloudfunctions.net/contarShare?platoId=${p.id}`,
            { method: 'POST' }
        ).catch(() => {});
        if (navigator.share) {
            try {
                await navigator.share({ title: loc(p, 'nombre'), text: texto, url });
                contarShare();   // solo si no canceló el share
            } catch (_) { /* canceló */ }
        } else {
            window.open(`https://wa.me/?text=${encodeURIComponent(texto + '\n' + url)}`, '_blank');
            contarShare();
        }
    };

    function cardPlato(p) {
        const thumb  = fotoThumb(p.fotos?.[0]);
        const precio = p.precio != null ? `$${Number(p.precio).toLocaleString('es-AR')}` : '';
        const desc   = loc(p, 'descripcion');
        const tags   = (p.tags ?? []).map(t => `<span class="tag ${t}">${tagLabel(t)}</span>`).join('');
        return `
        <div class="plato-card" data-plato-id="${p.id}" onclick="abrirModal('${p.id}')">
            <div class="plato-info">
                <p class="plato-nombre">${loc(p, 'nombre')}</p>
                ${desc ? `<p class="plato-desc">${desc}</p>` : ''}
                <div class="plato-footer">
                    ${precio ? `<span class="plato-precio">${precio}</span>` : ''}
                    ${tags}
                </div>
                <button class="btn-fav-carta" data-id="${p.id}" title="${tr('quieroProbar')}"
                    onclick="event.stopPropagation(); window.cartaSocial?.toggleFavorito('${p.id}')">♡</button>
            </div>
            ${thumb
                ? `<img class="plato-foto" src="${thumb}" alt="${loc(p, 'nombre')}" loading="lazy">`
                : `<div class="plato-foto-placeholder">🍽️</div>`}
        </div>`;
    }

    // ── Scroll spy (actualiza tab activo al scrollear manualmente) ───────────
    let _spyObserver = null;
    function initScrollSpy(secciones) {
        _spyObserver?.disconnect();
        const observer = _spyObserver = new IntersectionObserver(entries => {
            if (pausaObserver) return;
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                activarTab(entry.target.dataset.seccionId);
            });
        }, { rootMargin: '-15% 0px -75% 0px' });

        secciones.forEach(s => {
            const el = document.getElementById('sec-' + s.id);
            if (el) observer.observe(el);
        });
    }

    // ── Modal ─────────────────────────────────────────────────────────────────
    let _fotosModal = []; // guarda los objetos foto del plato abierto

    window.abrirModal = function(id) {
        const p = platos.find(pl => pl.id === id);
        if (!p) return;

        _platoAbiertoId = id;
        fotoIdx    = 0;
        _fotosModal = p.fotos ?? [];
        const fotosEl = document.getElementById('modal-fotos');

        fotosEl.innerHTML = _fotosModal.length
            ? _fotosModal.map((f, i) =>
                `<img src="${fotoMedium(f)}" data-full="${fotoFull(f)}" class="${i === 0 ? 'visible' : ''}" alt="">`
              ).join('')
              + ((_fotosModal.length > 1) ? `
                <button class="modal-nav prev" onclick="navFoto(-1)">‹</button>
                <button class="modal-nav next" onclick="navFoto(1)">›</button>
                <div class="foto-dots">
                    ${_fotosModal.map((_, i) => `<div class="foto-dot ${i===0?'active':''}" onclick="irFoto(${i})"></div>`).join('')}
                </div>` : '')
              + `<button class="btn-hd" onclick="verFullHD()" title="Ver en Full HD">HD</button>`
            : `<div style="height:200px;background:#f0ece4;display:flex;align-items:center;justify-content:center;font-size:3rem;">🍽️</div>`;

        document.getElementById('modal-nombre').textContent = loc(p, 'nombre');
        document.getElementById('modal-desc').textContent   = loc(p, 'descripcion');
        document.getElementById('modal-precio').textContent =
            p.precio != null ? `$${Number(p.precio).toLocaleString('es-AR')}` : '';
        document.getElementById('modal-tags').innerHTML =
            (p.tags ?? []).map(t => `<span class="tag ${t}">${tagLabel(t)}</span>`).join('');
        document.getElementById('btn-compartir').innerHTML = tr('compartir');

        document.getElementById('modal-overlay').classList.add('open');
        document.body.style.overflow = 'hidden';
        document.getElementById('modal-social').innerHTML = '';
        window.cartaSocial?.onModalAbierto(id);
    };

    window.verFullHD = function() {
        const img = document.querySelectorAll('#modal-fotos img')[fotoIdx];
        if (!img) return;
        const fullSrc = img.dataset.full;
        if (!fullSrc || img.src === fullSrc) return;
        const btn = document.querySelector('.btn-hd');
        if (btn) btn.textContent = '...';
        const tmp = new Image();
        tmp.onload = () => {
            img.src = fullSrc;
            if (btn) { btn.textContent = 'HD'; btn.classList.add('loaded'); }
        };
        tmp.src = fullSrc;
    };

    function _cerrarModalSheet() {
        document.getElementById('modal-overlay').classList.remove('open');
        document.body.style.overflow = '';
        window.cartaSocial?.onModalCerrado();
    }

    window.cerrarModal = function(e) {
        if (e.target === document.getElementById('modal-overlay')) _cerrarModalSheet();
    };

    window.cerrarModalX = _cerrarModalSheet;

    // Swipe para cerrar — non-passive para poder preventDefault y evitar scroll
    (function() {
        const overlay = document.getElementById('modal-overlay');
        const sheet   = document.querySelector('.modal-sheet');
        let startY = null, dy = 0, esGestureCierre = false;

        overlay.addEventListener('touchstart', e => {
            if (e.target.closest('#modal-fotos')) return;
            startY = e.touches[0].clientY;
            dy = 0;
            esGestureCierre = false;
            sheet.style.transition = 'none';
        }, { passive: true });

        overlay.addEventListener('touchmove', e => {
            if (startY === null) return;
            const delta = e.touches[0].clientY - startY;

            if (!esGestureCierre) {
                // Confirmar que es gesto de cierre: hacia abajo y sheet sin scroll
                if (delta > 8 && sheet.scrollTop === 0) {
                    esGestureCierre = true;
                } else if (delta < -4 || sheet.scrollTop > 0) {
                    startY = null; // es scroll normal, no interferir
                    return;
                } else {
                    return; // todavía decidiendo
                }
            }

            e.preventDefault(); // bloquea el scroll del contenedor
            dy = Math.max(0, delta);
            sheet.style.transform = `translateY(${dy}px)`;
        }, { passive: false });

        overlay.addEventListener('touchend', () => {
            if (!esGestureCierre) { startY = null; return; }
            sheet.style.transition = 'transform 0.28s cubic-bezier(0.32,0.72,0,1)';
            if (dy > 80) {
                sheet.style.transform = 'translateY(110%)';
                setTimeout(() => {
                    sheet.style.transform = '';
                    sheet.style.transition = '';
                    _cerrarModalSheet();
                }, 280);
            } else {
                sheet.style.transform = 'translateY(0)';
                setTimeout(() => { sheet.style.transition = ''; }, 300);
            }
            startY = null; dy = 0; esGestureCierre = false;
        });
    })();

    window.navFoto = function(dir) {
        const imgs = document.querySelectorAll('#modal-fotos img');
        const dots = document.querySelectorAll('.foto-dot');
        if (!imgs.length) return;
        imgs[fotoIdx].classList.remove('visible');
        dots[fotoIdx]?.classList.remove('active');
        fotoIdx = (fotoIdx + dir + imgs.length) % imgs.length;
        imgs[fotoIdx].classList.add('visible');
        dots[fotoIdx]?.classList.add('active');
    };

    window.irFoto = function(idx) {
        const imgs = document.querySelectorAll('#modal-fotos img');
        const dots = document.querySelectorAll('.foto-dot');
        imgs[fotoIdx].classList.remove('visible');
        dots[fotoIdx]?.classList.remove('active');
        fotoIdx = idx;
        imgs[fotoIdx].classList.add('visible');
        dots[fotoIdx]?.classList.add('active');
    };

    // Swipe táctil
    let tx = 0;
    document.getElementById('modal-fotos').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
    document.getElementById('modal-fotos').addEventListener('touchend',   e => {
        const diff = tx - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) navFoto(diff > 0 ? 1 : -1);
    });

    init();

    // Cuenta cada carga real de la carta (botón Ver Menú, link compartido, QR, URL directa, etc.)
    fetch('https://us-central1-corcega-loyalty-club.cloudfunctions.net/contarAperturaMenu', { method: 'POST' })
        .catch(() => {});
</script>
